<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2621" />
      <stop offset="50%" stop-color="#0E1613" />
      <stop offset="100%" stop-color="#060A08" />
    </linearGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="30%" stop-color="#F9CD05" />
      <stop offset="70%" stop-color="#E5B203" />
      <stop offset="100%" stop-color="#9C7700" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5" />

  <!-- Inner Cyber Corner Accents -->
  <path d="M 22 36 L 22 22 L 36 22" fill="none" stroke="#F9CD05" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 106 36 L 106 22 L 92 22" fill="none" stroke="#F9CD05" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 22 92 L 22 106 L 36 106" fill="none" stroke="#F9CD05" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 106 92 L 106 106 L 92 106" fill="none" stroke="#F9CD05" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Mini Crown over R -->
  <path d="M 50 32 L 56 38 L 64 30 L 72 38 L 78 32 L 75 42 L 53 42 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Royal Cyber 'R' Emblem -->
  <text x="64" y="94" font-family="'Outfit', 'Inter', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)" letter-spacing="-1">R</text>
</svg>
