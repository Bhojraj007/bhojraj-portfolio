<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Lost in Space | Bhojraj Upadhayay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #e8e8ed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: orbFloat 20s ease-in-out infinite;
    }

    .orb-1 {
      width: 500px; height: 500px;
      background: #6366f1;
      top: -15%; left: -10%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 400px; height: 400px;
      background: #ec4899;
      bottom: -20%; right: -5%;
      animation-delay: -7s;
      animation-duration: 25s;
    }

    .orb-3 {
      width: 300px; height: 300px;
      background: #06b6d4;
      top: 50%; left: 60%;
      animation-delay: -14s;
      animation-duration: 22s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(60px, -40px) scale(1.1); }
      50% { transform: translate(-30px, 50px) scale(0.95); }
      75% { transform: translate(40px, 20px) scale(1.05); }
    }

    /* Star particles */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: starTwinkle 3s ease-in-out infinite;
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.8; }
    }

    /* Main content */
    .error-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    /* Glitch 404 number */
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(8rem, 20vw, 16rem);
      font-weight: 700;
      line-height: 1;
      position: relative;
      margin-bottom: 1rem;
      animation: codeEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .error-code .code-main {
      background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      display: inline-block;
    }

    .error-code .code-main::before,
    .error-code .code-main::after {
      content: '404';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .error-code .code-main::before {
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      animation: glitchTop 3s ease-in-out infinite;
    }

    .error-code .code-main::after {
      background: linear-gradient(135deg, #ec4899, #f472b6);
      animation: glitchBottom 3s ease-in-out infinite;
    }

    @keyframes glitchTop {
      0%, 95%, 100% { clip-path: inset(0 0 66% 0); transform: translate(0); }
      96% { clip-path: inset(0 0 66% 0); transform: translate(-4px, -2px); }
      97% { clip-path: inset(0 0 66% 0); transform: translate(4px, 2px); }
    }

    @keyframes glitchBottom {
      0%, 95%, 100% { clip-path: inset(66% 0 0 0); transform: translate(0); }
      96% { clip-path: inset(66% 0 0 0); transform: translate(4px, 2px); }
      97% { clip-path: inset(66% 0 0 0); transform: translate(-4px, -2px); }
    }

    @keyframes codeEntry {
      from { transform: scale(0.5) translateY(40px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Astronaut icon */
    .error-icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      animation: astronautFloat 6s ease-in-out infinite, iconEntry 0.6s ease 0.2s both;
      display: inline-block;
    }

    @keyframes astronautFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(5deg); }
      75% { transform: translateY(8px) rotate(-3deg); }
    }

    @keyframes iconEntry {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
      animation: textEntry 0.6s ease 0.3s both;
    }

    .error-description {
      color: rgba(255, 255, 255, 0.55);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 450px;
      margin: 0 auto 2.5rem;
      animation: textEntry 0.6s ease 0.4s both;
    }

    @keyframes textEntry {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Action buttons */
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: textEntry 0.6s ease 0.5s both;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
    }

    .error-btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    }

    .error-btn-primary:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.45);
    }

    .error-btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .error-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* Footer branding */
    .error-footer {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255,255,255,0.2);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .error-actions { flex-direction: column; align-items: center; }
      .error-btn { width: 100%; max-width: 280px; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Animated background orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Star particles (generated via JS) -->
  <div class="stars" id="stars"></div>

  <!-- Main content -->
  <div class="error-wrapper">
    <div class="error-code"><span class="code-main">404</span></div>
    <div class="error-icon">🧑‍🚀</div>
    <h1 class="error-title">Lost in the Digital Cosmos</h1>
    <p class="error-description">
      The page you're looking for has drifted into deep space. It may have been moved, renamed, or doesn't exist anymore.
    </p>
    <div class="error-actions">
      <a href="/" class="error-btn error-btn-primary">
        <i class="fas fa-home"></i> Go Home
      </a>
      <button class="error-btn error-btn-secondary" onclick="history.back()">
        <i class="fas fa-arrow-left"></i> Go Back
      </button>
    </div>
  </div>

  <div class="error-footer">Bhojraj Upadhayay</div>

  <script>
    // Generate random stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
      star.style.animationDelay = (Math.random() * 5) + 's';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
