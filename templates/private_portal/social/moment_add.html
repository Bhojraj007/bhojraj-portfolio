{% extends "private_base.html" %}
{% load static %}

{% block content %}
<div class="resonance-container" style="max-width: 600px; margin: 4rem auto; padding: 2rem;">
    <div class="luxury-card reveal active" style="padding: 2.5rem; border: 1px solid var(--accent-blue);">
        <h2 style="color: var(--accent-blue); margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;">
            <i class="fas fa-magic"></i> New Sanctuary Moment
        </h2>
        <p style="color: var(--text-dim); margin-bottom: 2rem;">Capture a fleeting spark. This moment will vanish into the ether in 24 hours.</p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 2rem;">
                <label style="display: block; margin-bottom: 0.8rem; color: #fff;">Title (Optional)</label>
                <input type="text" name="title" class="social-input" style="width: 100%;" placeholder="A fleeting thought...">
            </div>

            <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.8rem; color: #fff;">Image Fragment</label>
                    <input type="file" name="image" accept="image/*" class="social-input" style="width: 100%;">
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.8rem; color: #fff;">Video Fragment</label>
                    <input type="file" name="video" accept="video/*" class="social-input" style="width: 100%;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 2.5rem; display: flex; align-items: center; gap: 1rem;">
                <input type="checkbox" name="is_public" checked id="id_is_public" style="width: 1.2rem; height: 1.2rem;">
                <label for="id_is_public" style="color: #fff;">Broadcast to Global Pulse</label>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="social-btn" style="flex: 2; padding: 1rem; background: var(--accent-blue); color: #fff; font-weight: 600;">
                    Ignite Moment
                </button>
                <a href="{% url 'private_portal:pulse' %}" class="social-btn" style="flex: 1; padding: 1rem; text-align: center; border: 1px solid var(--glass-border);">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<style>
.social-input {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 1rem;
    color: #fff;
    outline: none;
    transition: 0.3s;
}

.social-input:focus {
    border-color: var(--accent-blue);
    background: rgba(255, 255, 255, 0.1);
}

.social-btn {
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    font-size: 0.95rem;
}

.social-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    filter: brightness(1.2);
}
</style>
{% endblock %}
