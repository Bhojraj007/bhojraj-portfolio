<!-- Notification Glassmorphism Drawer -->
<div id="notification-drawer" class="notif-drawer">
    <div class="drawer-header">
        <h3>Social Resonance</h3>
        <button id="close-notifs" class="social-btn"><i class="fas fa-times"></i></button>
    </div>
    <div id="notif-list" class="notif-list">
        <div class="palette-hint">Seeking new vibrations...</div>
    </div>
</div>

<style>
.notif-drawer {
    position: fixed;
    top: 0;
    right: -400px;
    width: 350px;
    height: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border-left: 1px solid var(--glass-border);
    z-index: 10000;
    transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    box-shadow: -20px 0 50px rgba(0,0,0,0.3);
}

.notif-drawer.active {
    right: 0;
}

.drawer-header {
    padding: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--glass-border);
}

.drawer-header h3 {
    font-size: 1.2rem;
    color: #fff;
    margin: 0;
    letter-spacing: 1px;
}

.notif-list {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
}

.notif-item {
    padding: 1.2rem;
    margin-bottom: 0.8rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 15px;
    color: #cbd5e1;
    font-size: 0.9rem;
    transition: 0.3s;
}

.notif-item.unread {
    background: rgba(0, 210, 255, 0.05);
    border-left: 3px solid var(--accent-blue);
}

.notif-item strong {
    color: var(--accent-blue);
}

.notif-item:hover {
    background: rgba(255,255,255,0.08);
}

.pulse-badge {
    position: absolute;
    top: 5px;
    right: 15px;
    width: 8px;
    height: 8px;
    background: #ff4757;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff4757;
}

@keyframes pulse-notif {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
}

.pulse-badge::after {
    content: '';
    position: absolute;
    inset: 0;
    background: inherit;
    border-radius: inherit;
    animation: pulse-notif 1.5s infinite;
}
</style>

<script>
document.getElementById('close-notifs').onclick = () => {
    document.getElementById('notification-drawer').classList.remove('active');
};
</script>
